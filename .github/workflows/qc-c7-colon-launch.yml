name: QC Canvas C7 colon launch

on:
  push:
    paths:
      - "c-canvas-2560.html"
      - "c5-side-overlays.js"
      - "tools/qc-c7-colon-launch.mjs"
      - ".github/workflows/qc-c7-colon-launch.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qc:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check C7
        run: |
          node --check c5-side-overlays.js
          node --check c5-side-state.js
          node --check c5-side-seconds.js
          node --check canvas-renderer-c3.js
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Run colon launch QC
        run: |
          mkdir -p qc
          python3 -m http.server 8000 >/tmp/c7-server.log 2>&1 &
          sleep 2
          node tools/qc-c7-colon-launch.mjs
      - name: Clean temporary dependencies
        if: always()
        run: rm -rf node_modules package.json package-lock.json
      - name: Commit QC report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qc/c7-colon-launch-report.json qc/c7-colons-initial.png qc/c7-colons-early.png qc/c7-colons-middle.png qc/c7-colons-final.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record Canvas C7 colon-launch QC [skip ci]"
          git pull --rebase origin main
          git push
