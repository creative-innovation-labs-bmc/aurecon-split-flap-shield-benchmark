name: QC Canvas C10 mobile text Y

on:
  push:
    paths:
      - "c-canvas-2560.html"
      - "canvas-cell.js"
      - "tuning.css"
      - "tools/qc-c10-mobile-text-y.mjs"
      - ".github/workflows/qc-c10-mobile-text-y.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Serve locally
        run: python3 -m http.server 8000 >/tmp/c10-http.log 2>&1 &
      - name: Run mobile QC
        run: node tools/qc-c10-mobile-text-y.mjs
      - name: Clean temporary dependencies
        if: always()
        run: rm -rf node_modules package.json package-lock.json
      - name: Commit QC evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qc/c10-mobile-text-y-report.json qc/c10-mobile-texty-0.png qc/c10-mobile-texty-3.png || true
          if ! git diff --cached --quiet; then
            git commit -m "Store C10 mobile text Y QC [skip ci]"
            git push
          fi
