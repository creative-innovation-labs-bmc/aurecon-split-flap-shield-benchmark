name: QC Canvas C8 small text centre

on:
  push:
    paths:
      - "c-canvas-2560.html"
      - "canvas-cell.js"
      - "tools/qc-c8-small-text-centre.mjs"
      - ".github/workflows/qc-c8-small-text-centre.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qc:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check C8
        run: |
          node --check canvas-cell.js
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Run E and 3 centring QC
        run: |
          mkdir -p qc
          python3 -m http.server 8000 >/tmp/c8-server.log 2>&1 &
          sleep 2
          node tools/qc-c8-small-text-centre.mjs
      - name: Clean temporary dependencies
        if: always()
        run: rm -rf node_modules package.json package-lock.json
      - name: Commit QC evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qc/c8-small-text-centre-report.json qc/c8-small-text-centre-3840x804.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record Canvas C8 small-text centring QC [skip ci]"
          git pull --rebase origin main
          git push
