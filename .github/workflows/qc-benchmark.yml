name: QC Shield benchmark

on:
  push:
    paths:
      - ".github/workflows/qc-benchmark.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qc:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Copy self-hosted Open Sans
        run: |
          git clone --depth 1 https://github.com/creative-innovation-labs-bmc/aurecon-split-flap-wall-open-sans.git /tmp/source-wall
          mkdir -p fonts
          cp /tmp/source-wall/fonts/OpenSans-Variable.ttf fonts/OpenSans-Variable.ttf
          cp /tmp/source-wall/fonts/OFL.txt fonts/OFL.txt
          test -s fonts/OpenSans-Variable.ttf
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check
        run: |
          for f in data-core.js data-offices.js shared-state-a.js shared-state-b.js shared-runtime-a.js benchmark-metrics.js benchmark-ui.js wallbench-compat.js renderer-dom3d.js renderer-dom2d.js canvas-setup.js canvas-cell.js canvas-overlays.js canvas-renderer.js; do node --check "$f"; done
      - name: Install browser QC runtime
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Run four renderer benchmarks
        run: |
          mkdir -p qc
          python3 -m http.server 8000 >/tmp/bench-server.log 2>&1 &
          sleep 2
          node tools/qc-benchmark.mjs
      - name: Clean temporary dependencies
        if: always()
        run: rm -rf node_modules package.json package-lock.json
      - name: Commit font and QC evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fonts qc
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add self-hosted Open Sans and benchmark QC [skip ci]"
          git pull --rebase origin main
          git push
