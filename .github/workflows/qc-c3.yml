name: QC Canvas C3 office motion
on:
  push:
    paths:
      - "tools/qc-c3.mjs"
      - ".github/workflows/qc-c3.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  qc:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - run: |
          python3 -m http.server 8000 >/tmp/c3-server.log 2>&1 &
          sleep 2
          node tools/qc-c3.mjs
      - if: always()
        run: rm -rf node_modules package.json package-lock.json
      - if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qc
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record Canvas C3 office-motion QC [skip ci]"
          git pull --rebase origin main
          git push
